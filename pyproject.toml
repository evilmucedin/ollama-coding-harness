[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "och"
version = "0.1.0"
description = "och — a coding agent CLI harness for local Ollama models (stdlib only)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
och = "och.cli:main"

[tool.setuptools]
packages = ["och"]
